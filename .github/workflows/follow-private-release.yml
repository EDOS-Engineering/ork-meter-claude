name: follow-private-release

# Resumes a stopped public release, by hand only. The normal path needs no run
# of this workflow, because each step starts the next: the private
# repository's deliver-release.py starts public-sync once orkmeter.com serves
# the release; the sync pull request's merge starts package-runtime; the
# signed tag's push starts publish-release. People queue the pull requests and
# sign the tag. Each run of this one advances one step
# (.github/scripts/follow_release.py) and opens an issue when a person must act.
# The production environment still gates each build and publication. See
# docs/release.md, "Syncing from development".

on:
  workflow_dispatch: # by hand only; delivery, the merges and the tag push start each step

permissions:
  contents: read

concurrency:
  group: follow-private-release
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # start the release workflows and CI on generated branches
      issues: write # report a release that stopped
      pull-requests: read # read the generated pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Advance the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.ORK_METER_READ_TOKEN }} # read-only; see docs/release.md
        run: python3 -I -B .github/scripts/follow_release.py
